name: Update catalog

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Refresh catalog
        run: npm run catalog -- --strict

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-catalog
          base: ${{ github.event.repository.default_branch }}
          add-paths: src/catalog.json
          commit-message: "chore: update imagery catalog"
          title: "chore: update imagery catalog"
          body: |
            Refreshes `src/catalog.json` from the municipal GIS services.

            Created automatically by the monthly or manually triggered catalog workflow.
